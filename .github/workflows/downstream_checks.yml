name: Downstream checks

on:
  push:
    branches: [custom/main]
  pull_request:
    branches: [custom/main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mask-and-loss-tests:
    name: Mask and loss tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy imageio opencv-python-headless piexif "pycolmap>=3.10.0" pytest pytest-check pytest-env rich tqdm
      - name: Run downstream and upstream loss tests
        run: python -m pytest -q tests/test_colmap_masks.py tests/test_losses.py

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package without CUDA compilation
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy ninja rich wheel
          BUILD_NO_CUDA=1 python -m pip install --no-build-isolation -e .
          python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: make -C docs html SPHINXOPTS="-W --keep-going"
